# TEMPLATES
_silver_spark_dataset: &spark_dataset
  type: processing_datalake.extras.datasets.spark.SparkTableDataset
  directory: "${globals:datalake.silver}"
  table_format: delta
  save_args: &default_save_args
    mode: overwrite
    mergeSchema: true
  metadata:
    kedro-viz:
      layer: silver

_silver_delta_dataset: &delta_dataset
  type: processing_datalake.extras.datasets.delta.DeltaTableDataset
  directory: "${globals:datalake.silver}"
  metadata:
    kedro-viz:
      layer: silver

# DATASETS
silver_routes@spark:
  <<: *spark_dataset
  table: routes_cleaned
  save_args:
    <<: *default_save_args

silver_routes@delta:
  <<: *delta_dataset
  table: routes_cleaned

silver_routes_true:
  type: MemoryDataset
  data: true
  metadata:
    kedro-viz:
      layer: silver

