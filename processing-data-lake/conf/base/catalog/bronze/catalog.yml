# TEMPLATES
_bronze_spark_dataset: &spark_dataset
  type: processing_datalake.extras.datasets.spark.SparkTableDataset
  directory: "${globals:datalake.bronze}"
  table_format: delta
  save_args: &default_save_args
    mode: overwrite
    mergeSchema: true
  metadata:
    kedro-viz:
      layer: bronze

_bronze_delta_dataset: &delta_dataset
  type: processing_datalake.extras.datasets.delta.DeltaTableDataset
  directory: "${globals:datalake.bronze}"
  metadata:
    kedro-viz:
      layer: bronze

# DATASETS
bronze_routes@spark:
  <<: *spark_dataset
  table: routes_raw
  save_args:
    <<: *default_save_args

bronze_routes@delta:
  <<: *delta_dataset
  table: routes_raw

bronze_routes_true:
  type: MemoryDataset
  data: true
  metadata:
    kedro-viz:
      layer: bronze

