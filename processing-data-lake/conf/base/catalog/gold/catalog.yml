# TEMPLATES
_gold_spark_dataset: &spark_dataset
  type: processing_datalake.extras.datasets.spark.SparkTableDataset
  directory: "${globals:datalake.gold}"
  table_format: delta
  save_args: &default_save_args
    mode: overwrite
    mergeSchema: true
  metadata:
    kedro-viz:
      layer: gold

_gold_delta_dataset: &delta_dataset
  type: processing_datalake.extras.datasets.delta.DeltaTableDataset
  directory: "${globals:datalake.gold}"
  metadata:
    kedro-viz:
      layer: gold

# DATASETS
gold_trips_metrics@spark:
  <<: *spark_dataset
  table: trips_metrics
  save_args:
    <<: *default_save_args

gold_trips_metrics@delta:
  <<: *delta_dataset
  table: trips_metrics

gold_trips_metrics_true:
  type: MemoryDataset
  data: true
  metadata:
    kedro-viz:
      layer: gold
