# This is a Databricks asset bundle definition for tfm_bigdata.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: tfm_bigdata
  uuid: f1458217-6d1c-4883-9a6f-9a077ad9ca61

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405612198535189.9.azuredatabricks.net
    variables:
      catalog: tfmlakehouse
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405612198535189.9.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/juandaib@ucm.es to make sure we only have a single copy.
      root_path: /Workspace/Users/juandaib@ucm.es/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: tfmlakehouse
      schema: prod
    permissions:
      - user_name: juandaib@ucm.es
        level: CAN_MANAGE
